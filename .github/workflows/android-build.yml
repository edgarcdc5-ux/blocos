name: Compilar APK Android
on:
  push:
    branches: [main, release/v1.0.2, design/etapa-1-base-visual]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4
      - name: Extrair projeto CleanEditor v1.0.1
        run: |
          test -f CleanEditor-v1.0.1-source.zip
          unzip -n CleanEditor-v1.0.1-source.zip -d .

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: CleanEditor-etapa-1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
